name: CI
on:
  push:
  pull_request:
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/mobile
      - run: npm run lint -w apps/mobile
      - run: npm run test -w apps/mobile
      - run: npm run typecheck -w packages/shared
      - run: npm run lint -w apps/admin
      - run: npm run test -w apps/admin
      - run: npm run build -w apps/admin
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e './backend[dev]'
      - run: ruff check backend scripts
      # `python -m` keeps the repository root on sys.path so active tooling under
      # scripts/ can be imported consistently on GitHub-hosted runners.
      - run: python -m pytest backend/tests scripts/test_import_educational_content.py
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: pip install httpx 'psycopg[binary]>=3.2,<4'
      - run: npx supabase start
      - name: Verify Writing V2 upgrade preserves historical data
        run: |
          npx supabase db reset --version 20261116010000 --no-seed
          python scripts/supabase_writing_upgrade_fixture.py seed
          npx supabase migration up
          python scripts/supabase_writing_upgrade_fixture.py verify
      - run: npx supabase db reset
      - run: npx supabase db lint --level error
      - name: Check Edge Functions
        run: >-
          deno check
          supabase/functions/real-english-generate/index.ts
          supabase/functions/dictionary-import/index.ts
          supabase/functions/study-plan/index.ts
          supabase/functions/translate/index.ts
          supabase/functions/writing-grammar/index.ts
          supabase/functions/writing-ai-coach/index.ts
          supabase/functions/writing-ai-rewrite/index.ts
          supabase/functions/arena-question-generate/index.ts
          supabase/functions/journey-lesson-generate/index.ts
      - name: Test Arena question generator contracts
        run: deno test supabase/functions/_shared/arena-question-generator.test.ts
      - name: Test Journey lesson generator contracts
        run: deno test supabase/functions/_shared/journey-lesson-generator.test.ts
      - name: Run SQL transaction smoke tests
        run: >-
          python scripts/run_local_sql_test.py
          supabase/tests/security_definer_privileges_smoke.sql
          supabase/tests/admin_atomic_crud_smoke.sql
          supabase/tests/phase2_learning_content_smoke.sql
          supabase/tests/writing_ai_v2_smoke.sql
          supabase/tests/writing_v2_2_smoke.sql
          supabase/tests/writing_v2_3_smoke.sql
          supabase/tests/writing_v2_4_smoke.sql
          supabase/tests/quiz_arena_practice_smoke.sql
          supabase/tests/quiz_arena_time_attack_smoke.sql
          supabase/tests/quiz_arena_ranked_smoke.sql
          supabase/tests/quiz_mistake_review_smoke.sql
          supabase/tests/quiz_question_management_smoke.sql
          supabase/tests/journey_v2_1_smoke.sql
          supabase/tests/journey_v2_2_smoke.sql
          supabase/tests/journey_v2_3_smoke.sql
          supabase/tests/journey_v2_4_smoke.sql
          supabase/tests/journey_v2_5_smoke.sql
          supabase/tests/journey_v2_6_smoke.sql
          supabase/tests/journey_v2_6_admin_completion_smoke.sql
          supabase/tests/journey_v2_7_hardening_smoke.sql
      - name: Verify Arena upgrade preserves Journey history
        run: python scripts/supabase_arena_upgrade_check.py
      - name: Verify Time Attack upgrade preserves Practice and Journey
        run: python scripts/supabase_arena_upgrade_check.py --time-attack
      - name: Verify Ranked upgrade preserves Arena and Journey
        run: python scripts/supabase_arena_upgrade_check.py --ranked
      - name: Run Time Attack timing and concurrency integration tests
        run: python scripts/supabase_time_attack_integration.py
      - name: Run Arena practice and concurrency integration tests
        run: python scripts/supabase_arena_integration.py
      - name: Run Auth, RLS and publishing integration tests
        run: python scripts/supabase_local_integration.py
      - name: Run concurrent Admin retry test
        run: python scripts/supabase_admin_atomic_concurrency.py
      - name: Run concurrent Daily Writing reward test
        run: python scripts/supabase_writing_daily_concurrency.py
      - if: always()
        run: npx supabase stop --no-backup
