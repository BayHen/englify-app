[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "englify-quest-backend"
version = "0.1.0"
description = "Englify Quest API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<1",
  "pydantic-settings>=2.16,<3",
  "SQLAlchemy>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.17,<0.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
